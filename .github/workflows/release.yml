name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches plugin version
        run: |
          v=$(grep -m1 '^ \* Version:' ai-calendar.php | awk '{print $3}')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != plugin version $v"; exit 1; }
      - name: Build zip
        run: git archive --prefix=ai-calendar/ -o ai-calendar.zip HEAD
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ai-calendar.zip --generate-notes || gh release upload "$GITHUB_REF_NAME" ai-calendar.zip --clobber
